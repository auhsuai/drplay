[package]
name = "tauri-plugin-webview-settings"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "tauri-plugin-webview-settings"
description = "Android WebView settings lock (textZoom=100) for DrPlay mobile"
license = "MIT OR Apache-2.0"

[lib]
name = "tauri_plugin_webview_settings"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.10.2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2.5.3", features = ["build"] }
