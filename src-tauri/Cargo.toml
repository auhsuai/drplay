[package]
name = "drplay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "drplay"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-keepawake = "0.1.0"
# First-party Tauri plugin (github.com/tauri-apps/plugins-workspace), not the
# third-party `tauri-plugin-tracing` crate that was also considered -- that
# one is a single-maintainer community crate (~21k downloads, created 2025)
# bundling flamegraph/CPU-profiling/OpenTelemetry features this app has no
# use for. `log` is the plain, stable, first-party facade (`log::info!` etc.)
# that replaces every `eprintln!`/`println!` call site below with leveled,
# filterable, optionally-persisted logging -- see targets/level config in
# lib.rs's `run()`.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured command errors (src-tauri/src/error.rs's `AppError`): derives
# `Display`/`std::error::Error` from `#[error("...")]` per variant so
# `AppError` still formats as the plain message text everywhere Rust code
# does `.to_string()`/`{e}` on it (e.g. log::error! call sites), while serde
# (already a dependency above) handles the `{kind, message}` JSON shape sent
# to the frontend.
thiserror = "2"
# v5 (up from 4.4.2): v4's removed `oauth2::reqwest::http_client`/
# `async_http_client` helpers built their HTTP client with default settings,
# which follow redirects during the code/token exchange -- v5's own docs
# call this out as an SSRF risk and require the caller to build an explicit
# client instead (see src-tauri/src/commands/auth.rs). "reqwest-blocking" is
# a separate opt-in feature in v5 (not part of its default feature set,
# unlike v4) needed for the sync client used during the code exchange.
oauth2 = { version = "5", features = ["reqwest-blocking"] }
url = "2.5.0"
reqwest = { version = "0.12.4", features = ["json", "stream", "rustls-tls", "blocking"] }
open = "5.1.2"
# OS-keychain-backed storage for the OAuth refresh token (Windows Credential
# Manager / macOS Keychain / Linux Secret Service), replacing plaintext
# localStorage. See src-tauri/src/commands/token_store.rs.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24.0"
# Narrowed from "full": grepped every `tokio::` call site in src/ and only
# these submodules are actually used (sync primitives, the proxy's own
# TcpListener, time::sleep/timeout, spawn/join/select/pin + #[tokio::test]).
# `fs` added for commands/download.rs's streaming-to-disk download (writes
# each fetched chunk directly to a file instead of buffering in memory);
# no tokio::process or tokio::signal usage anywhere.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tiny_http = "0.12.0"
hmac = "0.12.1"
sha2 = "0.10.8"
axum = "0.7.5"
tokio-stream = "0.1.15"
bytes = "1.6.0"

uuid = { version = "1.8.0", features = ["v4"] }
rand = "0.8"
# Pinned to an explicit commit (not `branch = "main"`) so a future
# `cargo update` can't silently move to a different, unreviewed commit --
# `branch = "main"` re-resolves to whatever main's HEAD is at update time,
# which is not reproducible. This specific commit is intentional, not a
# leftover: it's newer than the latest crates.io release (0.12.15, commit
# 616473e) and carries a real fix ("Fix LRU eviction stall under concurrent
# key reuse", PR moka-rs/moka#592, merged 2026-07-12) that is NOT in any
# released version yet -- directly relevant to this app's own cache
# workload (many concurrent requests can hit the same track/slice key).
# Swapping to the crates.io release would silently drop that fix. Cargo.lock
# already resolves to this exact commit today, so this changes nothing
# about which code is compiled -- it only makes the pin explicit/immutable.
moka = { git = "https://github.com/moka-rs/moka", rev = "e617b5f064cdb3ce9845cef06961fdbf07bd9946", features = ["future"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
