[package]
name = "drplay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "drplay"

[workspace]
members = ["tauri-plugin-native-audio", "tauri-plugin-saf-download"]
default-members = ["."]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Vendored fork (v1.0.5 + Authorization-header support for Google Drive
# streaming) — workspace member so tauri-cli builds its Android/Kotlin side.
tauri-plugin-native-audio = { path = "tauri-plugin-native-audio" }
# SAF download folder picker + writer (Android only — Task 4 mobile-polish).
tauri-plugin-saf-download = { path = "tauri-plugin-saf-download" }
tauri-plugin-opener = "2"
# Android/iOS custom-scheme deep links (RFC 8252 mobile OAuth redirect).
# Rust side only — the JS getCurrent is not used; permission deep-link:default
# is granted in capabilities for the get_current command.
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = "4.4.2"
# DPoP (RFC 9449) sender-constrained OAuth tokens for Google's token endpoint
# (src-tauri/src/dpop.rs): P-256 key pair for ES256 proof JWTs. `ecdsa` enables
# SigningKey/VerifyingKey, `getrandom` powers SigningKey::generate(), `pkcs8`
# provides PKCS#8 DER encode/decode for persisting the key in the OS vault.
p256 = { version = "0.14", features = ["ecdsa", "getrandom", "pkcs8"] }
# Secure storage for the Google OAuth refresh token: keyring's v1 feature
# (default) routes to the OS credential vault — Windows Credential Manager on
# Windows (windows-native-keyring-store). Replaces plaintext localStorage.
# On Android, v1's one-time store init has no Android arm (keyring-4.1.6
# src/v1.rs:109-129) — the feature only pulls in the store crate, so
# token_store.rs sets the default store itself (keyring_core::set_default_store).
keyring = { version = "4.1.6", features = ["android-native-keyring-store"] }
# Same version keyring 4.1.6 uses (keyring-core 1.0.0); needed to call
# set_default_store directly on Android.
keyring-core = "1.0.0"
base64 = "0.22.1"
url = "2.5.0"
reqwest = { version = "0.12.4", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
open = "5.1.2"
image = "0.25.10"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.30"
symphonia = { version = "0.5.4", features = ["all"] }
lofty = "0.24.0"
tiny_http = "0.12.0"
hmac = "0.12.1"
sha2 = "0.10.8"

bytes = "1.6.0"

uuid = { version = "1.8.0", features = ["v4"] }
moka = { git = "https://github.com/moka-rs/moka", branch = "main", features = ["future"] }
walkdir = "2.5.0"
log = "0.4.33"
rand = "0.8.5"
# Seed offline import (2026-08-10): read metadata+cover backups (seed.zip).
# zip 2.x (resolves 2.6.1, 2025-04-04) provides ZipArchive::by_index +
# ZipFile::enclosed_name — the safe-path (zip-slip) check the import relies on.
zip = "2"

# keepawake has no Android backend (keepawake 0.5.1 src/sys/mod.rs:14
# compile_error "Unsupported cfg") — desktop only; frontend already
# catch-warns on invoke failure.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-keepawake = "0.1.0"

# Android Keystore-backed credential store for the refresh token
# (keyring-compatible, same 1.0.0 version keyring 4.1.6 enables via its
# "android-native-keyring-store" feature; direct dep because Rust cannot use
# transitive deps). Shared-preferences file encrypted with a Keystore key.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
# jni 0.21 matches wry + android-native-keyring-store; used to capture the
# process JavaVM + application Context for ndk-context (tauri 2.11/tao 0.35
# no longer initialize it — see token_store.rs android_keystore module).
jni = "0.21"
ndk-context = "0.1"

# Direct access to the WebView2 COM API to set MemoryUsageTargetLevel when the
# window goes inactive (wry's WebViewExtWindows is not reachable through
# tauri::webview::PlatformWebview, whose fields are private). Versions match
# the ones already in Cargo.lock via tauri/wry — no new crate graph nodes.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
