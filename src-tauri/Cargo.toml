[package]
name = "drplay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "drplay"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-keepawake = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = "4.4.2"
base64 = "0.22.1"
url = "2.5.0"
reqwest = { version = "0.12.4", features = ["json", "stream", "rustls-tls"] }
open = "5.1.2"
image = "0.25.10"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.30"
symphonia = { version = "0.5.4", features = ["all"] }
lofty = "0.24.0"
tiny_http = "0.12.0"
hmac = "0.12.1"
sha2 = "0.10.8"

bytes = "1.6.0"

# Direct access to the WebView2 COM API to set MemoryUsageTargetLevel when the
# window goes inactive (wry's WebViewExtWindows is not reachable through
# tauri::webview::PlatformWebview, whose fields are private). Versions match
# the ones already in Cargo.lock via tauri/wry — no new crate graph nodes.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"

uuid = { version = "1.8.0", features = ["v4"] }
moka = { git = "https://github.com/moka-rs/moka", branch = "main", features = ["future"] }
walkdir = "2.5.0"
log = "0.4.33"
rand = "0.8.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
