[package]
name = "drplay"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "drplay"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
# File + stdout logger (R05-6): the app previously had no logger at all, so
# every `log::*` call site was a no-op and release (windows_subsystem =
# "windows") had zero diagnostics. Rotation keeps the log dir bounded.
tauri-plugin-log = "2"
tauri-plugin-keepawake = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# oauth2 5.0.0: client stateful (AsyncHttpClient/SyncHttpClient), nền reqwest 0.12
# (bỏ reqwest 0.11 trùng trong graph). reqwest-blocking cần cho login_google_native
# chạy trong spawn_blocking.
oauth2 = { version = "5", features = ["reqwest-blocking"] }
# Secure storage for the Google OAuth refresh token: keyring's v1 feature
# (default) routes to the OS credential vault — Windows Credential Manager on
# Windows (windows-native-keyring-store). Replaces plaintext localStorage.
keyring = "4.1.6"
base64 = "0.22.1"
url = "2.5.0"
reqwest = { version = "0.12.4", features = ["json", "stream", "rustls-tls"] }
open = "5.1.2"
image = "0.25.10"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.30"
symphonia = { version = "0.5.4", features = ["all"] }
lofty = "0.24.0"
tiny_http = "0.12.0"
# Proxy engine (src/stream_proxy/server.rs). tiny_http cannot close a
# keep-alive connection from the server side, so an aborted upstream body
# left mpv on a silent socket (incident 2026-09-13); hyper aborts the
# connection as soon as the response body stream errors. Versions reuse the
# exact crates already pinned in Cargo.lock via reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
hmac = "0.12.1"
sha2 = "0.10.8"

bytes = "1.6.0"

# Direct access to the WebView2 COM API to set MemoryUsageTargetLevel when the
# window goes inactive (wry's WebViewExtWindows is not reachable through
# tauri::webview::PlatformWebview, whose fields are private). Versions match
# the ones already in Cargo.lock via tauri/wry — no new crate graph nodes.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"
# Orphan guarantee for the mpv sidecar: Windows Job Object with
# KILL_ON_JOB_CLOSE (see src/mpv/job.rs). Pinned to 0.59 to reuse the
# version already in Cargo.lock (no new graph nodes).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

uuid = { version = "1.8.0", features = ["v4"] }
moka = { git = "https://github.com/moka-rs/moka", branch = "main", features = ["future"] }
walkdir = "2.5.0"
log = "0.4.33"
rand = "0.8.5"
# Seed offline import (2026-08-10): read metadata+cover backups (seed.zip).
# zip 2.x (resolves 2.6.1, 2025-04-04) provides ZipArchive::by_index +
# ZipFile::enclosed_name — the safe-path (zip-slip) check the import relies on.
zip = "2"

# tao 0.35.3 holds the `window_state` mutex across an ITaskbarList COM call in
# the TaskbarCreated handler (upstream issue #1263) — reentrant window handling
# can then deadlock the main thread permanently (explorer restart / resume from
# sleep). PR #1264 fixes it; this rev is the merge commit on `dev`, whose
# Cargo.toml still declares tao 0.35.3 (satisfies tauri-runtime-wry's
# `tao = "^0.35.0"`). Remove once a released tauri-runtime-wry pulls tao >= 0.36.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "f7f8173dc85287b2a18aceb9c47533097b8c123f" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
