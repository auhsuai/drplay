name: Build DrPlay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Create Google OAuth credentials file
        run: |
          if (-not (Test-Path wa_credential.json)) {
            $json = @'
          ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
        '@
            if ($json.Trim() -eq '') {
              echo "::warning::GOOGLE_OAUTH_CREDENTIALS secret not set, using placeholder"
              $json = '{"installed":{"client_id":"placeholder","project_id":"placeholder","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_secret":"placeholder","redirect_uris":["http://localhost"]}}'
            }
            Set-Content -Path wa_credential.json -Value $json
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build -- --bundles msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DrPlay-Installer
          path: src-tauri/target/release/bundle/msi/*.msi
