name: Build DrPlay Android APK

on:
  push:
    branches: [feature/android-port]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Create Google OAuth credentials file
        shell: pwsh
        env:
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
        run: |
          if (Test-Path wa_credential.json) { exit 0 }
          Set-Content -Path wa_credential.json -Value $env:GOOGLE_OAUTH_CREDENTIALS

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK (AGP 8.11 default) and pin SDK env
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Setup Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Android APK (arm64 only)
        run: npm run tauri android build -- --apk --target aarch64 --ci

      - name: Publish APK to GitHub Release (direct download, no zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APKS=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f)
          if [ -z "$APKS" ]; then
            echo "No APK found — build output missing" >&2
            exit 1
          fi
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest \
            --title "DrPlay Android APK" \
            --notes "Build ${{ github.sha }} — cài trực tiếp trên điện thoại." \
            $APKS